[workspace]
resolver = "2"
members = [
    "crates/ferrox-core",
    "crates/ferrox-net",
    "crates/ferrox-shield",
    "crates/ferrox-governor",
    "crates/ferrox-storage",
    "crates/ferrox-search",
    "crates/ferrox-updater",
    "crates/ferrox-engine",
    "crates/ferrox-ui",
    "crates/ferrox-app",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
authors = ["Ferrox Browser Contributors"]
repository = "https://github.com/Ahmaddragon11/ferrox"
homepage = "https://github.com/Ahmaddragon11/ferrox"
rust-version = "1.95"

[workspace.dependencies]
# Internal crates
ferrox-core = { path = "crates/ferrox-core" }
ferrox-net = { path = "crates/ferrox-net" }
ferrox-shield = { path = "crates/ferrox-shield" }
ferrox-governor = { path = "crates/ferrox-governor" }
ferrox-storage = { path = "crates/ferrox-storage" }
ferrox-search = { path = "crates/ferrox-search" }
ferrox-updater = { path = "crates/ferrox-updater" }
ferrox-engine = { path = "crates/ferrox-engine" }
ferrox-ui = { path = "crates/ferrox-ui" }

# Core / Async / Serialization
tokio = { version = "1.44", features = ["rt-multi-thread", "macros", "sync", "time", "net", "fs", "io-util"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
thiserror = "2.0"
anyhow = "1.0"
url = "2.5"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.16", features = ["v4", "serde"] }
directories = "6.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
parking_lot = "0.12"
sysinfo = "0.34"

# Networking & Security
reqwest = { version = "0.13.5", default-features = false, features = ["native-tls", "http2", "charset", "system-proxy", "gzip", "brotli", "zstd", "json", "hickory-dns"] }
adblock = { version = "0.13.5", default-features = false, features = ["embedded-domain-resolver", "full-regex-handling"] }
rusqlite = { version = "0.34", features = ["bundled"] }

# Pure-Rust HTML Engine (Turbo Mode)
html5ever = "0.29"
scraper = "0.23"

# Updater / Crypto
semver = { version = "1.0", features = ["serde"] }
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
sha2 = "0.10"
hex = "0.4"
self-replace = "1.5.1"
zip = "2.2"

# UI & WebView
winit = { version = "0.30.13", features = ["rwh_06"] }
egui = "0.37.0"
egui-winit = { version = "0.37.0", default-features = false, features = ["clipboard", "links"] }
egui-wgpu = { version = "0.37.0", default-features = false, features = ["winit"] }
wgpu = "30.0"
wry = { version = "0.57.2", features = ["devtools"] }
raw-window-handle = "0.6.2"
http = "1.2"
mimalloc = "0.1.52"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
