name: Ferrox Release

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin: ferrox.exe
            archive: ferrox-windows-x86_64.zip
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin: ferrox
            archive: ferrox-linux-x86_64.tar.gz
    runs-on: ${{ matrix.os }}
    env:
      FERROX_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || format('0.2.0-{0}', github.sha) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }} -p ferrox-app

      - name: Package Windows archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path "target/${{ matrix.target }}/release/${{ matrix.bin }}" -DestinationPath "${{ matrix.archive }}"
          (Get-FileHash "${{ matrix.archive }}" -Algorithm SHA256).Hash | Out-File "${{ matrix.archive }}.sha256"

      - name: Package Linux archive
        if: runner.os == 'Linux'
        run: |
          tar -czf "${{ matrix.archive }}" -C "target/${{ matrix.target }}/release" "${{ matrix.bin }}"
          sha256sum "${{ matrix.archive }}" > "${{ matrix.archive }}.sha256"

      - name: Prepare release metadata
        id: metadata
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            VERSION="${{ github.ref_name }}"
            IS_TAG="true"
          else
            VERSION="${{ env.FERROX_VERSION }}"
            IS_TAG="false"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "is_tag=${IS_TAG}" >> "$GITHUB_OUTPUT"

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.metadata.outputs.version }}
          name: Ferrox Browser ${{ steps.metadata.outputs.version }}
          body: |
            ## Ferrox Browser ${{ steps.metadata.outputs.version }}

            تلقائي البناء - متصفح ويب سريع مكتوب بـ Rust.

            ### التحميلات
            - **Windows:** `ferrox-windows-x86_64.zip` (SHA256: ${{ matrix.archive }}.sha256)
            - **Linux:** `ferrox-linux-x86_64.tar.gz` (SHA256: ${{ matrix.archive }}.sha256)

            ### ملاحظات
            - تم البناء تلقائياً من GitHub Actions.
            - تحقق من ملف SHA256 قبل التثبيت.
          draft: false
          prerelease: ${{ steps.metadata.outputs.is_tag == 'false' }}
          files: |
            ${{ matrix.archive }}
            ${{ matrix.archive }}.sha256
