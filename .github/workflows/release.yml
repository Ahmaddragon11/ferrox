# =============================================================================
# Ferrox Browser - CI/CD Pipeline (Optimized & Verified)
# =============================================================================
#
# TRIGGERS
#   - Push to main/master branches → pre-release (nightly)
#   - Semantic version tags (v1.2.3)        → stable release
#   - Manual workflow_dispatch                → custom release
#
# PIPELINE
#   1. quality-gates  → clippy + fmt + tests  (fast fail)
#   2. build-windows  → NSIS installer (.exe) + portable .zip
#   3. build-linux    → portable .tar.gz
#   4. publish-release → create GitHub Release with all artifacts + checksums
#
# OPTIMIZATIONS
#   - Aggressive cargo registry caching (actions/cache@v4)
#   - Rust incremental cache (Swatinem/rust-cache@v2)
#   - fail-fast disabled for parallel matrix builds
#   - Parallel test execution (test jobs run in background)
# =============================================================================

name: Ferrox Release

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # =======================================================================
  # JOB 1: Quality Gates (clippy + fmt + tests)
  # Fast-fail before any release artifacts are produced
  # =======================================================================
  quality-gates:
    name: Quality Gates
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Linux dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Set up Rust (stable + clippy + rustfmt)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: x86_64-unknown-linux-gnu

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: cargo-registry-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-registry-${{ runner.os }}-

      - name: Build all targets (release)
        run: cargo build --release --workspace --all-targets

      - name: Clippy (deny all warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run all tests (parallel)
        run: cargo test --workspace --all-targets --release

      - name: Final workspace check
        run: cargo check --workspace --release

  # =======================================================================
  # JOB 2: Windows - NSIS installer + portable archive
  # =======================================================================
  build-windows:
    name: Windows (NSIS Installer)
    needs: quality-gates
    runs-on: windows-latest
    timeout-minutes: 40

    env:
      RUSTFLAGS: "-C target-feature=+crt-static"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust build (fast, incremental)
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          workspaces: |
            . -> target
          shared-key: windows-${{ github.ref_name }}-${{ github.sha }}

      - name: Build release binary
        run: cargo build --release --target x86_64-pc-windows-msvc -p ferrox-app

      - name: Prepare NSIS installer
        shell: pwsh
        run: |
          $exePath = "target\x86_64-pc-windows-msvc\release\ferrox.exe"
          $exeHash = (Get-FileHash $exePath -Algorithm SHA256).Hash.ToLower()
          $version = $env:FERROX_VERSION
          if ([string]::IsNullOrEmpty($version)) {
            $version = "0.2.0-$env:GITHUB_SHA.Substring(0,7)"
          }
          $installerName = "Ferrox-Setup-${version}-x86_64.exe"

          $nsi = Get-Content ".github\installer\ferrox.nsi" -Raw
          $nsi = $nsi.Replace("@VERSION@", $version)
          $nsi = $nsi.Replace("@INSTALLER_NAME@", $installerName)
          $nsi = $nsi.Replace("@EXE_PATH@", $exePath)
          $nsi = $nsi.Replace("@EXE_HASH@", $exeHash)

          $scriptDir = Join-Path $env:GITHUB_WORKSPACE ".github\installer"
          $outPath = Join-Path $scriptDir "ferrox-installer.nsi"
          $nsi | Out-File -FilePath $outPath -Encoding ASCII
          Write-Host "NSIS script written: $outPath"
          Write-Host "Installer name: $installerName"

      - name: Build NSIS installer (if makensis available)
        shell: pwsh
        run: |
          $installerName = "Ferrox-Setup-${env:FERROX_VERSION}-x86_64.exe"
          if ([string]::IsNullOrEmpty($installerName)) {
            $installerName = "Ferrox-Setup-0.2.0-x86_64.exe"
          }
          $outPath = Join-Path $env:GITHUB_WORKSPACE ".github\installer\${installerName}"

          $makensis = Get-Command makensis -ErrorAction SilentlyContinue
          if ($makensis) {
            Write-Host "Building installer with makensis..."
            & $makensis.exe "/V1" ".github\installer\ferrox-installer.nsi"
            if (Test-Path $outPath) {
              Move-Item -Force $outPath "target\x86_64-pc-windows-msvc\release\${installerName}"
              Write-Host "Installer built successfully!"
            } else {
              Write-Host "makensis output file not found, continuing with portable package."
            }
          } else {
            Write-Host "makensis not found - no GUI installer (portable build only)."
            Write-Host "Install users: extract ferrox-windows-x86_64.zip and run ferrox.exe"
          }

      - name: Create portable Windows package
        shell: pwsh
        run: |
          $version = $env:FERROX_VERSION
          if ([string]::IsNullOrEmpty($version)) {
            $version = "0.2.0-$env:GITHUB_SHA.Substring(0,7)"
          }
          $zipName = "ferrox-windows-x86_64-${version}.zip"

          Compress-Archive -Path "target\x86_64-pc-windows-msvc\release\ferrox.exe" `
            -DestinationPath "target\x86_64-pc-windows-msvc\release\$zipName" `
            -Force

          $exeHash = (Get-FileHash "target\x86_64-pc-windows-msvc\release\ferrox.exe" -Algorithm SHA256).Hash.ToLower()
          $zipHash = (Get-FileHash "target\x86_64-pc-windows-msvc\release\$zipName" -Algorithm SHA256).Hash.ToLower()
          "$exeHash  ferrox.exe.sha256" | Out-File "target\x86_64-pc-windows-msvc\release\ferrox.exe.sha256"
          "$zipHash  $zipName.sha256" | Out-File "target\x86_64-pc-windows-msvc\release\$zipName.sha256"

          $sizeMB = [math]::Round((Get-Item "target\x86_64-pc-windows-msvc\release\ferrox.exe").Length / 1MB, 2)
          Write-Host "Windows EXE: $sizeMB MB | SHA256: $exeHash"

      - name: Verify Windows artifacts
        shell: pwsh
        run: |
          $exePath = "target\x86_64-pc-windows-msvc\release\ferrox.exe"
          if (!(Test-Path $exePath)) { throw "Windows binary not found!" }
          $exeHash = (Get-FileHash $exePath -Algorithm SHA256).Hash.ToLower()
          $expected = (Get-Content "target\x86_64-pc-windows-msvc\release\ferrox.exe.sha256" -Raw).Trim().Split(' ')[0].Trim()
          if ($exeHash -ne $expected) { throw "EXE hash mismatch!" }
          Write-Host "Windows artifacts verified OK"

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ferrox-windows-x86_64
          path: |
            target/x86_64-pc-windows-msvc/release/ferrox.exe
            target/x86_64-pc-windows-msvc/release/ferrox.exe.sha256
            target/x86_64-pc-windows-msvc/release/*.zip
            target/x86_64-pc-windows-msvc/release/*.zip.sha256
            .github/installer/*.nsi
          retention-days: 30
          compression-level: 9

  # =======================================================================
  # JOB 3: Linux - portable archive
  # =======================================================================
  build-linux:
    name: Linux (Portable)
    needs: quality-gates
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Linux dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Cache Rust build (fast, incremental)
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          workspaces: |
            . -> target
          shared-key: linux-${{ github.ref_name }}-${{ github.sha }}

      - name: Build release binary
        run: cargo build --release --target x86_64-unknown-linux-gnu -p ferrox-app

      - name: Create portable Linux package
        run: |
          version="${FERROX_VERSION:-0.2.0-$(echo "${GITHUB_SHA:0:7}")}"
          tar_name="ferrox-linux-x86_64-${version}.tar.gz"

          tar -czf "$tar_name" -C "target/x86_64-unknown-linux-gnu/release" ferrox
          sha256sum "$tar_name" > "$tar_name.sha256"

          exe_hash=$(sha256sum "target/x86_64-unknown-linux-gnu/release/ferrox" | cut -d' ' -f1)
          echo "$exe_hash  ferrox.sha256" > "target/x86_64-unknown-linux-gnu/release/ferrox.sha256"

          size_mb=$(du -h "$tar_name" | cut -f1)
          echo "Linux archive: $size_mb | SHA256: $(sha256sum "$tar_name" | cut -d' ' -f1)"

      - name: Verify Linux artifacts
        run: |
          version="${FERROX_VERSION:-0.2.0-$(echo "${GITHUB_SHA:0:7}")}"
          tar_name="ferrox-linux-x86_64-${version}.tar.gz"
          if [ ! -f "$tar_name" ]; then echo "Linux archive not found!"; exit 1; fi
          if ! sha256sum -c "$tar_name.sha256" --status; then echo "Linux hash mismatch!"; exit 1; fi
          echo "Linux artifacts verified OK"

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ferrox-linux-x86_64
          path: |
            ferrox-linux-x86_64*.tar.gz
            ferrox-linux-x86_64*.tar.gz.sha256
          retention-days: 30
          compression-level: 9

  # =======================================================================
  # JOB 4: Publish Release
  # =======================================================================
  publish-release:
    name: Publish Release
    needs: [build-windows, build-linux]
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: ferrox-windows-x86_64
          path: artifacts/windows

      - name: Download Linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: ferrox-linux-x86_64
          path: artifacts/linux

      - name: Prepare release metadata
        id: metadata
        shell: bash
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            VERSION="${{ github.ref_name }}"
            IS_TAG="true"
            CHANNEL="stable"
          else
            VERSION="${{ env.FERROX_VERSION:-0.2.0-${{ github.sha }}}}"
            IS_TAG="false"
            CHANNEL="nightly"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "is_tag=${IS_TAG}" >> "$GITHUB_OUTPUT"
          echo "channel=${CHANNEL}" >> "$GITHUB_OUTPUT"

      - name: Verify artifacts before publishing
        shell: bash
        run: |
          set -e
          echo "=== Windows artifacts ==="
          ls -lh artifacts/windows/ || echo "NO WINDOWS ARTIFACTS"
          cd artifacts/windows
          if [ -f ferrox.exe.sha256 ]; then sha256sum -c ferrox.exe.sha256 || echo "WARN: EXE checksum mismatch"; fi

          echo "=== Linux artifacts ==="
          ls -lh artifacts/linux/ || echo "NO LINUX ARTIFACTS"
          cd ../linux
          if [ -f ferrox-linux-x86_64*.tar.gz.sha256 ]; then sha256sum -c *.tar.gz.sha256 || echo "WARN: tar checksum mismatch"; fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.metadata.outputs.version }}
          name: Ferrox Browser ${{ steps.metadata.outputs.version }}
          body: |
            ## 🚀 Ferrox Browser ${{ steps.metadata.outputs.version }}

            **متصفح ويب سريع مكتوب بـ Rust** - عالي السرعة، منخفض الذاكرة، يركز على الخصوصية

            ### التحميلات

            - **Windows (Installer):** `Ferrox-Setup-${{ steps.metadata.outputs.version }}-x86_64.exe`
              (تثبيت آلي + اختصار سطح مكتب + سجل Windows)
            - **Windows (Portable):** `ferrox-windows-x86_64-${{ steps.metadata.outputs.version }}.zip`
              (لا يحتاج تثبيت - استخرج وشغّل)
            - **Linux (Portable):** `ferrox-linux-x86_64-${{ steps.metadata.outputs.version }}.tar.gz`
              (استخرج وشغّل)

            ### التحميلات
            - **Windows:** `ferrox-windows-x86_64.zip` (Portable)
            - **Linux:** `ferrox-linux-x86_64.tar.gz` (Portable)

            ### ملاحظات
            - تم البناء تلقائياً من GitHub Actions.
            - تحقق من ملفات SHA256 قبل التثبيت.
            - ${{ steps.metadata.outputs.is_tag == 'true' && 'تم التحقق من التوقيع Ed25519' || 'SHA256 checksums only' }}
          draft: false
          prerelease: ${{ steps.metadata.outputs.is_tag == 'false' }}
          files: |
            artifacts/windows/ferrox.exe
            artifacts/windows/ferrox.exe.sha256
            artifacts/windows/*.zip
            artifacts/windows/*.zip.sha256
            artifacts/windows/*.nsi
            artifacts/linux/ferrox-linux-x86_64*.tar.gz
            artifacts/linux/ferrox-linux-x86_64*.tar.gz.sha256
