# =============================================================================
# Ferrox Browser - CI/CD Pipeline
# =============================================================================
# Triggers:
#   - Push to main/master  →  pre-release builds
#   - Push tags v*.*.*     →  stable releases
#   - Manual dispatch      →  custom release
# =============================================================================

name: Ferrox Release

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # =======================================================================
  # JOB 1: Quality Gates (fast-fail before building)
  # =======================================================================
  quality-gates:
    name: Quality Gates
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: x86_64-unknown-linux-gnu

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: cargo-registry-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-registry-${{ runner.os }}-

      - name: Build release (workspace)
        run: cargo build --release --workspace

      - name: Clippy (deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run tests
        run: cargo test --workspace --release

  # =======================================================================
  # JOB 2: Windows Build (portable executable)
  # =======================================================================
  build-windows:
    name: Windows (Portable)
    needs: quality-gates
    runs-on: windows-latest
    timeout-minutes: 40

    env:
      RUSTFLAGS: "-C target-feature=+crt-static"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          workspaces: . -> target
          shared-key: windows-${{ github.ref_name }}-${{ github.sha }}

      - name: Build release binary
        run: cargo build --release --target x86_64-pc-windows-msvc -p ferrox-app

      - name: Create portable Windows ZIP
        shell: pwsh
        run: |
          $version = if ($env:FERROX_VERSION) { $env:FERROX_VERSION } else { "0.2.0-$($env:GITHUB_SHA.Substring(0,7))" }
          $zipName = "ferrox-windows-x86_64-${version}.zip"
          $releaseDir = "target/x86_64-pc-windows-msvc/release"
          $zipPath = Join-Path $releaseDir $zipName
          $exePath = Join-Path $releaseDir "ferrox.exe"
          Compress-Archive -Path $exePath -DestinationPath $zipPath -Force
          $zipHash = (Get-FileHash $zipPath -Algorithm SHA256).Hash.ToLowerInvariant()
          $exeHash = (Get-FileHash $exePath -Algorithm SHA256).Hash.ToLowerInvariant()
          "$zipHash  $zipName" | Out-File "$($zipPath).sha256" -Encoding ascii
          "$exeHash  ferrox.exe" | Out-File "$($exePath).sha256" -Encoding ascii
          Write-Host "Built $zipName ($([math]::Round((Get-Item "target\x86_64-pc-windows-msvc\release\ferrox.exe").Length / 1MB, 2)) MB)"

      - name: Verify Windows artifacts
        shell: pwsh
        run: |
          $version = if ($env:FERROX_VERSION) { $env:FERROX_VERSION } else { "0.2.0-$($env:GITHUB_SHA.Substring(0,7))" }
          $releaseDir = "target/x86_64-pc-windows-msvc/release"
          $artifacts = @(
            @{ Path = (Join-Path $releaseDir "ferrox.exe"); Checksum = (Join-Path $releaseDir "ferrox.exe.sha256"); Name = "ferrox.exe" },
            @{ Path = (Join-Path $releaseDir "ferrox-windows-x86_64-$version.zip"); Checksum = (Join-Path $releaseDir "ferrox-windows-x86_64-$version.zip.sha256"); Name = "Windows portable ZIP" }
          )
          foreach ($artifact in $artifacts) {
            if (!(Test-Path $artifact.Path)) { throw "$($artifact.Name) was not found: $($artifact.Path)" }
            if (!(Test-Path $artifact.Checksum)) { throw "$($artifact.Name) checksum was not found: $($artifact.Checksum)" }
            $expected = (Get-Content $artifact.Checksum -Raw).Trim().Split()[0]
            $actual = (Get-FileHash $artifact.Path -Algorithm SHA256).Hash
            if ($actual -ine $expected) { throw "$($artifact.Name) SHA-256 mismatch" }
          }
          Write-Host "Windows artifacts verified OK"

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ferrox-windows-x86_64
          path: |
            target/x86_64-pc-windows-msvc/release/ferrox.exe
            target/x86_64-pc-windows-msvc/release/ferrox.exe.sha256
            target/x86_64-pc-windows-msvc/release/*.zip
            target/x86_64-pc-windows-msvc/release/*.zip.sha256
          retention-days: 30

  # =======================================================================
  # JOB 3: Linux Build (portable)
  # =======================================================================
  build-linux:
    name: Linux (Portable)
    needs: [quality-gates, build-windows]
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev nsis

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          workspaces: . -> target
          shared-key: linux-${{ github.ref_name }}-${{ github.sha }}

      - name: Build release binary
        run: cargo build --release --target x86_64-unknown-linux-gnu -p ferrox-app

      - name: Create portable Linux archive
        run: |
          version="${FERROX_VERSION:-0.2.0-$(echo "${GITHUB_SHA:0:7}")}"
          tar_name="ferrox-linux-x86_64-${version}.tar.gz"
          tar -czf "$tar_name" -C target/x86_64-unknown-linux-gnu/release ferrox
          sha256sum "$tar_name" > "$tar_name.sha256"
          sha256sum target/x86_64-unknown-linux-gnu/release/ferrox > target/x86_64-unknown-linux-gnu/release/ferrox.sha256
          echo "Built $tar_name ($(du -h "$tar_name" | cut -f1))"

      - name: Verify Linux artifacts
        run: |
          version="${FERROX_VERSION:-0.2.0-$(echo "${GITHUB_SHA:0:7}")}"
          tar_name="ferrox-linux-x86_64-${version}.tar.gz"
          if [ ! -f "$tar_name" ]; then echo "Linux archive not found!"; exit 1; fi
          sha256sum -c "$tar_name.sha256" --status || { echo "Linux hash mismatch!"; exit 1; }
          echo "Linux artifacts verified OK"

      - name: Download Windows artifacts for installer
        uses: actions/download-artifact@v4
        with:
          name: ferrox-windows-x86_64
          path: artifacts/windows

      - name: Build Windows NSIS installer
        shell: bash
        run: |
          set -euo pipefail
          version="${FERROX_VERSION:-0.2.0-${GITHUB_SHA:0:7}}"
          installer_name="Ferrox-Setup-${version}-x86_64.exe"
          mkdir -p installer-work
          curl -fsSL "https://go.microsoft.com/fwlink/p/?LinkId=2124703" \
            -o installer-work/MicrosoftEdgeWebview2Setup.exe
          if [[ "$(stat -c%s installer-work/MicrosoftEdgeWebview2Setup.exe)" -lt 102400 ]]; then
            echo "WebView2 bootstrapper download is missing or incomplete" >&2
            exit 1
          fi
          exe_path="$PWD/artifacts/windows/ferrox.exe"
          webview2_path="$PWD/installer-work/MicrosoftEdgeWebview2Setup.exe"
          icon_path="$PWD/.github/installer/ferrox.ico"
          sed \
            -e "s|@VERSION@|${version}|g" \
            -e "s|@INSTALLER_NAME@|${installer_name}|g" \
            -e "s|@EXE_PATH@|${exe_path}|g" \
            -e "s|@WEBVIEW2_PATH@|${webview2_path}|g" \
            -e "s|@ICON_PATH@|${icon_path}|g" \
            .github/installer/ferrox.nsi > installer-work/ferrox-installer.nsi
          makensis -V1 installer-work/ferrox-installer.nsi
          if [[ ! -s "$installer_name" ]]; then
            echo "NSIS did not create $installer_name" >&2
            exit 1
          fi
          mv "$installer_name" artifacts/windows/
          (cd artifacts/windows && sha256sum "$installer_name" > "$installer_name.sha256")

      - name: Verify Windows installer
        run: |
          cd artifacts/windows
          installer="Ferrox-Setup-${FERROX_VERSION:-0.2.0-${GITHUB_SHA:0:7}}-x86_64.exe"
          sha256sum -c "$installer.sha256" --status
          test -s "$installer"
          echo "Windows NSIS installer verified OK"

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ferrox-linux-x86_64
          path: |
            ferrox-linux-x86_64*.tar.gz
            ferrox-linux-x86_64*.tar.gz.sha256
          retention-days: 30

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: ferrox-windows-installer
          path: |
            artifacts/windows/Ferrox-Setup-*.exe
            artifacts/windows/Ferrox-Setup-*.exe.sha256
          retention-days: 30

  # =======================================================================
  # JOB 4: Publish Release (auto on every push + tags)
  # =======================================================================
  publish-release:
    name: Publish Release
    needs: [build-windows, build-linux]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: ferrox-windows-x86_64
          path: artifacts/windows

      - name: Download Windows installer
        uses: actions/download-artifact@v4
        with:
          name: ferrox-windows-installer
          path: artifacts/windows-installer

      - name: Download Linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: ferrox-linux-x86_64
          path: artifacts/linux

      - name: Prepare release metadata
        id: metadata
        shell: bash
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            VERSION="${{ github.ref_name }}"
            IS_TAG="true"
            CHANNEL="stable"
          else
            VERSION="nightly-${{ github.sha }}"
            IS_TAG="false"
            CHANNEL="nightly"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "is_tag=${IS_TAG}" >> "$GITHUB_OUTPUT"
          echo "channel=${CHANNEL}" >> "$GITHUB_OUTPUT"

      - name: Verify artifacts before publishing
        shell: bash
        run: |
          set -e
          echo "=== Windows ==="
          ls -lh artifacts/windows/ || echo "NO WINDOWS ARTIFACTS"
          echo "=== Windows installer ==="
          ls -lh artifacts/windows-installer/ || echo "NO WINDOWS INSTALLER"
          echo "=== Linux ==="
          ls -lh artifacts/linux/ || echo "NO LINUX ARTIFACTS"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.metadata.outputs.version }}
          name: Ferrox Browser ${{ steps.metadata.outputs.version }} (${{ steps.metadata.outputs.channel }})
          body: |
            ## 🚀 Ferrox Browser ${{ steps.metadata.outputs.version }} (${{ steps.metadata.outputs.channel }})

            **متصفح ويب سريع مكتوب بـ Rust** - عالي السرعة، منخفض الذاكرة، يركز على الخصوصية

            ### التحميلات

            - **Windows (Installer):** `Ferrox-Setup-${{ steps.metadata.outputs.version }}-x86_64.exe` (تثبيت سريع ومباشر)
            - **Windows (Portable):** `ferrox-windows-x86_64-${{ steps.metadata.outputs.version }}.zip` (استخرج وشغّل)
            - **Linux (Portable):** `ferrox-linux-x86_64-${{ steps.metadata.outputs.version }}.tar.gz` (استخرج وشغّل)

            ### ملاحظات
            - تم البناء تلقائياً من GitHub Actions عند كل push.
            - تحقق من ملفات SHA256 قبل التثبيت.
            - القناة: ${{ steps.metadata.outputs.channel }}
          draft: false
          prerelease: ${{ steps.metadata.outputs.is_tag == 'false' }}
          files: |
            artifacts/windows/ferrox.exe
            artifacts/windows/ferrox.exe.sha256
            artifacts/windows-installer/Ferrox-Setup-*.exe
            artifacts/windows-installer/Ferrox-Setup-*.exe.sha256
            artifacts/windows/*.zip
            artifacts/windows/*.zip.sha256
            artifacts/linux/ferrox-linux-x86_64*.tar.gz
            artifacts/linux/ferrox-linux-x86_64*.tar.gz.sha256
