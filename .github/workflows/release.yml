# =============================================================================
# Ferrox Browser - CI/CD Pipeline
# =============================================================================
# Triggers:
#   - Push to main/master  →  pre-release builds
#   - Push tags v*.*.*     →  stable releases
#   - Manual dispatch      →  custom release
# =============================================================================

name: Ferrox Release

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # =======================================================================
  # JOB 1: Quality Gates (fast-fail before building)
  # =======================================================================
  quality-gates:
    name: Quality Gates
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: x86_64-unknown-linux-gnu

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: cargo-registry-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-registry-${{ runner.os }}-

      - name: Build release (workspace)
        run: cargo build --release --workspace

      - name: Clippy (deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run tests
        run: cargo test --workspace --release

  # =======================================================================
  # JOB 2: Windows Build (NSIS installer + portable)
  # =======================================================================
  build-windows:
    name: Windows (NSIS Installer)
    needs: quality-gates
    runs-on: windows-latest
    timeout-minutes: 40

    env:
      RUSTFLAGS: "-C target-feature=+crt-static"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          workspaces: . -> target
          shared-key: windows-${{ github.ref_name }}-${{ github.sha }}

      - name: Build release binary
        run: cargo build --release --target x86_64-pc-windows-msvc -p ferrox-app

      - name: Create portable Windows ZIP
        shell: pwsh
        run: |
          $version = if ($env:FERROX_VERSION) { $env:FERROX_VERSION } else { "0.2.0-$($env:GITHUB_SHA.Substring(0,7))" }
          $zipName = "ferrox-windows-x86_64-${version}.zip"
          Compress-Archive -Path "target/x86_64-pc-windows-msvc/release/ferrox.exe" -DestinationPath "target/x86_64-pc-windows-msvc/release/$zipName" -Force
          $hash = (Get-FileHash "target/x86_64-pc-windows-msvc/release/ferrox.exe" -Algorithm SHA256).Hash.ToLower()
          "$hash  $zipName" | Out-File "target/x86_64-pc-windows-msvc/release/$zipName.sha256"
          "$hash  ferrox.exe" | Out-File "target/x86_64-pc-windows-msvc/release/ferrox.exe.sha256"
          Write-Host "Built $zipName ($([math]::Round((Get-Item "target\x86_64-pc-windows-msvc\release\ferrox.exe").Length / 1MB, 2)) MB)"

      - name: Verify Windows artifacts
        shell: pwsh
        run: |
          $exePath = "target\x86_64-pc-windows-msvc\release\ferrox.exe"
          if (!(Test-Path $exePath)) { throw "Windows binary not found!" }
          Write-Host "Windows artifacts verified OK"

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ferrox-windows-x86_64
          path: |
            target/x86_64-pc-windows-msvc/release/ferrox.exe
            target/x86_64-pc-windows-msvc/release/ferrox.exe.sha256
            target/x86_64-pc-windows-msvc/release/*.zip
            target/x86_64-pc-windows-msvc/release/*.zip.sha256
          retention-days: 30

  # =======================================================================
  # JOB 3: Linux Build (portable)
  # =======================================================================
  build-linux:
    name: Linux (Portable)
    needs: quality-gates
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          workspaces: . -> target
          shared-key: linux-${{ github.ref_name }}-${{ github.sha }}

      - name: Build release binary
        run: cargo build --release --target x86_64-unknown-linux-gnu -p ferrox-app

      - name: Create portable Linux archive
        run: |
          version="${FERROX_VERSION:-0.2.0-$(echo "${GITHUB_SHA:0:7}")}"
          tar_name="ferrox-linux-x86_64-${version}.tar.gz"
          tar -czf "$tar_name" -C target/x86_64-unknown-linux-gnu/release ferrox
          sha256sum "$tar_name" > "$tar_name.sha256"
          sha256sum target/x86_64-unknown-linux-gnu/release/ferrox > target/x86_64-unknown-linux-gnu/release/ferrox.sha256
          echo "Built $tar_name ($(du -h "$tar_name" | cut -f1))"

      - name: Verify Linux artifacts
        run: |
          version="${FERROX_VERSION:-0.2.0-$(echo "${GITHUB_SHA:0:7}")}"
          tar_name="ferrox-linux-x86_64-${version}.tar.gz"
          if [ ! -f "$tar_name" ]; then echo "Linux archive not found!"; exit 1; fi
          sha256sum -c "$tar_name.sha256" --status || { echo "Linux hash mismatch!"; exit 1; }
          echo "Linux artifacts verified OK"

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ferrox-linux-x86_64
          path: |
            ferrox-linux-x86_64*.tar.gz
            ferrox-linux-x86_64*.tar.gz.sha256
          retention-days: 30

  # =======================================================================
  # JOB 4: Publish Release (auto on every push + tags)
  # =======================================================================
  publish-release:
    name: Publish Release
    needs: [build-windows, build-linux]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: ferrox-windows-x86_64
          path: artifacts/windows

      - name: Download Linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: ferrox-linux-x86_64
          path: artifacts/linux

      - name: Prepare release metadata
        id: metadata
        shell: bash
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            VERSION="${{ github.ref_name }}"
            IS_TAG="true"
            CHANNEL="stable"
          else
            VERSION="nightly-${{ github.sha }}"
            IS_TAG="false"
            CHANNEL="nightly"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "is_tag=${IS_TAG}" >> "$GITHUB_OUTPUT"
          echo "channel=${CHANNEL}" >> "$GITHUB_OUTPUT"

      - name: Verify artifacts before publishing
        shell: bash
        run: |
          set -e
          echo "=== Windows ==="
          ls -lh artifacts/windows/ || echo "NO WINDOWS ARTIFACTS"
          echo "=== Linux ==="
          ls -lh artifacts/linux/ || echo "NO LINUX ARTIFACTS"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.metadata.outputs.version }}
          name: Ferrox Browser ${{ steps.metadata.outputs.version }} (${{ steps.metadata.outputs.channel }})
          body: |
            ## 🚀 Ferrox Browser ${{ steps.metadata.outputs.version }} (${{ steps.metadata.outputs.channel }})

            **متصفح ويب سريع مكتوب بـ Rust** - عالي السرعة، منخفض الذاكرة، يركز على الخصوصية

            ### التحميلات

            - **Windows (Portable):** `ferrox-windows-x86_64-${{ steps.metadata.outputs.version }}.zip` (استخرج وشغّل)
            - **Linux (Portable):** `ferrox-linux-x86_64-${{ steps.metadata.outputs.version }}.tar.gz` (استخرج وشغّل)

            ### ملاحظات
            - تم البناء تلقائياً من GitHub Actions عند كل push.
            - تحقق من ملفات SHA256 قبل التثبيت.
            - القناة: ${{ steps.metadata.outputs.channel }}
          draft: false
          prerelease: ${{ steps.metadata.outputs.is_tag == 'false' }}
          files: |
            artifacts/windows/ferrox.exe
            artifacts/windows/ferrox.exe.sha256
            artifacts/windows/*.zip
            artifacts/windows/*.zip.sha256
            artifacts/linux/ferrox-linux-x86_64*.tar.gz
            artifacts/linux/ferrox-linux-x86_64*.tar.gz.sha256
