# =============================================================================
# Ferrox Browser - CI/CD Pipeline
# =============================================================================
# Triggers:
#   - Push to main/master  →  pre-release builds
#   - Push tags v*.*.*     →  stable releases
#   - Manual dispatch      →  custom release
# =============================================================================

name: Ferrox Release

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # =======================================================================
  # JOB 1: Quality Gates (fast-fail before building)
  # =======================================================================
  quality-gates:
    name: Quality Gates
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: x86_64-unknown-linux-gnu

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: cargo-registry-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-registry-${{ runner.os }}-

      - name: Build release (workspace)
        run: cargo build --release --workspace

      - name: Clippy (deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run tests
        run: cargo test --workspace --release

  # =======================================================================
  # JOB 2: Windows Build (NSIS installer + portable)
  # =======================================================================
  build-windows:
    name: Windows (NSIS Installer + Portable)
    needs: quality-gates
    runs-on: windows-latest
    timeout-minutes: 40

    env:
      RUSTFLAGS: "-C target-feature=+crt-static"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          workspaces: . -> target
          shared-key: windows-${{ github.ref_name }}-${{ github.sha }}

      - name: Build release binary
        run: cargo build --release --target x86_64-pc-windows-msvc -p ferrox-app

      - name: Install NSIS (for .exe installer)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $nsisUrls = @(
            "https://pilotfiber.dl.sourceforge.net/project/nsis/NSIS%203/3.09/nsis-3.09.zip",
            "https://phoenixnap.dl.sourceforge.net/project/nsis/NSIS%203/3.09/nsis-3.09.zip"
          )
          $nsisZip = Join-Path $env:RUNNER_TEMP "nsis-3.09.zip"
          $nsisRoot = Join-Path $env:RUNNER_TEMP "nsis-3.09"
          $expectedSha256 = "f5dc52eef1f3884230520199bac6f36b82d643d86b003ce51bd24b05c6ba7c91"
          $downloaded = $false

          foreach ($nsisUrl in $nsisUrls) {
            try {
              Invoke-WebRequest -Uri $nsisUrl -OutFile $nsisZip
              $actualSha256 = (Get-FileHash $nsisZip -Algorithm SHA256).Hash
              if ($actualSha256 -ine $expectedSha256) {
                throw "NSIS archive SHA-256 mismatch (got $actualSha256)"
              }
              $downloaded = $true
              break
            } catch {
              Remove-Item $nsisZip -Force -ErrorAction SilentlyContinue
              Write-Warning "NSIS mirror $nsisUrl failed: $_"
            }
          }
          if (!$downloaded) { throw "Could not download a verified NSIS archive from any mirror" }

          Expand-Archive -Path $nsisZip -DestinationPath $env:RUNNER_TEMP -Force
          $makensisPath = Join-Path $nsisRoot "Bin\makensis.exe"
          if (!(Test-Path $makensisPath)) { throw "NSIS archive is missing Bin\makensis.exe" }
          if (!(Test-Path (Join-Path $nsisRoot "Stubs"))) { throw "NSIS archive is missing its Stubs directory" }
          $env:NSISDIR = $nsisRoot
          Add-Content -Path $env:GITHUB_ENV -Value "MAKENSIS_PATH=$makensisPath"
          Add-Content -Path $env:GITHUB_ENV -Value "NSISDIR=$nsisRoot"
          & $makensisPath "/VERSION"
          if ($LASTEXITCODE -ne 0) { throw "NSIS compiler self-check failed (exit code $LASTEXITCODE)" }

      - name: Prepare NSIS installer script
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = if ($env:FERROX_VERSION) { $env:FERROX_VERSION } else { "0.2.0-$($env:GITHUB_SHA.Substring(0,7))" }
          $installerName = "Ferrox-Setup-${version}-x86_64.exe"
          $releaseDir = "target/x86_64-pc-windows-msvc/release"
          $exePath = Join-Path $releaseDir "ferrox.exe"
          $webView2Path = Join-Path $releaseDir "MicrosoftEdgeWebview2Setup.exe"
          $iconPath = Join-Path $releaseDir "ferrox.ico"
          Copy-Item ".github/installer/ferrox.ico" $iconPath
          Invoke-WebRequest -Uri "https://go.microsoft.com/fwlink/p/?LinkId=2124703" -OutFile $webView2Path
          if (!(Test-Path $exePath)) { throw "Ferrox executable was not found: $exePath" }
          if ((Get-Item $webView2Path).Length -lt 100KB) { throw "WebView2 bootstrapper download is missing or incomplete" }

          Copy-Item ".github/installer/ferrox.nsi" "ferrox-installer.nsi"
          (Get-Content "ferrox-installer.nsi" -Raw) `
            -replace "@VERSION@", $version `
            -replace "@INSTALLER_NAME@", $installerName `
            -replace "@EXE_PATH@", $exePath `
            -replace "@WEBVIEW2_PATH@", $webView2Path `
            -replace "@ICON_PATH@", $iconPath `
            | Set-Content "ferrox-installer.nsi" -Encoding ASCII

          Write-Host "NSIS script prepared: ferrox-installer.nsi"
          Write-Host "Installer will be: $installerName"

      - name: Build NSIS installer (.exe)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = if ($env:FERROX_VERSION) { $env:FERROX_VERSION } else { "0.2.0-$($env:GITHUB_SHA.Substring(0,7))" }
          $installerName = "Ferrox-Setup-${version}-x86_64.exe"

          Write-Host "Building NSIS installer: $installerName"
          if (!(Test-Path $env:MAKENSIS_PATH)) { throw "Portable NSIS compiler was not extracted" }
          & $env:MAKENSIS_PATH "/V1" "ferrox-installer.nsi"
          if ($LASTEXITCODE -ne 0) { throw "NSIS failed to build the installer (exit code $LASTEXITCODE)" }
          if (!(Test-Path $installerName)) { throw "NSIS did not create $installerName" }
          $installerPath = "target/x86_64-pc-windows-msvc/release/$installerName"
          Move-Item -Force $installerName $installerPath
          $hash = (Get-FileHash $installerPath -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $installerName" | Out-File "$($installerPath).sha256" -Encoding ascii
          Write-Host "Installer built successfully and checksum saved: $installerPath"

      - name: Create portable Windows ZIP
        shell: pwsh
        run: |
          $version = if ($env:FERROX_VERSION) { $env:FERROX_VERSION } else { "0.2.0-$($env:GITHUB_SHA.Substring(0,7))" }
          $zipName = "ferrox-windows-x86_64-${version}.zip"
          $releaseDir = "target/x86_64-pc-windows-msvc/release"
          $zipPath = Join-Path $releaseDir $zipName
          $exePath = Join-Path $releaseDir "ferrox.exe"
          Compress-Archive -Path $exePath -DestinationPath $zipPath -Force
          $zipHash = (Get-FileHash $zipPath -Algorithm SHA256).Hash.ToLowerInvariant()
          $exeHash = (Get-FileHash $exePath -Algorithm SHA256).Hash.ToLowerInvariant()
          "$zipHash  $zipName" | Out-File "$($zipPath).sha256" -Encoding ascii
          "$exeHash  ferrox.exe" | Out-File "$($exePath).sha256" -Encoding ascii
          Write-Host "Built $zipName ($([math]::Round((Get-Item "target\x86_64-pc-windows-msvc\release\ferrox.exe").Length / 1MB, 2)) MB)"

      - name: Verify Windows artifacts
        shell: pwsh
        run: |
          $version = if ($env:FERROX_VERSION) { $env:FERROX_VERSION } else { "0.2.0-$($env:GITHUB_SHA.Substring(0,7))" }
          $releaseDir = "target/x86_64-pc-windows-msvc/release"
          $artifacts = @(
            @{ Path = (Join-Path $releaseDir "ferrox.exe"); Checksum = (Join-Path $releaseDir "ferrox.exe.sha256"); Name = "ferrox.exe" },
            @{ Path = (Join-Path $releaseDir "ferrox-windows-x86_64-$version.zip"); Checksum = (Join-Path $releaseDir "ferrox-windows-x86_64-$version.zip.sha256"); Name = "Windows portable ZIP" },
            @{ Path = (Join-Path $releaseDir "Ferrox-Setup-$version-x86_64.exe"); Checksum = (Join-Path $releaseDir "Ferrox-Setup-$version-x86_64.exe.sha256"); Name = "Windows installer" }
          )
          foreach ($artifact in $artifacts) {
            if (!(Test-Path $artifact.Path)) { throw "$($artifact.Name) was not found: $($artifact.Path)" }
            if (!(Test-Path $artifact.Checksum)) { throw "$($artifact.Name) checksum was not found: $($artifact.Checksum)" }
            $expected = (Get-Content $artifact.Checksum -Raw).Trim().Split()[0]
            $actual = (Get-FileHash $artifact.Path -Algorithm SHA256).Hash
            if ($actual -ine $expected) { throw "$($artifact.Name) SHA-256 mismatch" }
          }
          Write-Host "Windows artifacts verified OK"

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ferrox-windows-x86_64
          path: |
            target/x86_64-pc-windows-msvc/release/ferrox.exe
            target/x86_64-pc-windows-msvc/release/ferrox.exe.sha256
            target/x86_64-pc-windows-msvc/release/*.zip
            target/x86_64-pc-windows-msvc/release/*.zip.sha256
            target/x86_64-pc-windows-msvc/release/Ferrox-Setup-*.exe
            target/x86_64-pc-windows-msvc/release/Ferrox-Setup-*.exe.sha256
          retention-days: 30

  # =======================================================================
  # JOB 3: Linux Build (portable)
  # =======================================================================
  build-linux:
    name: Linux (Portable)
    needs: quality-gates
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          workspaces: . -> target
          shared-key: linux-${{ github.ref_name }}-${{ github.sha }}

      - name: Build release binary
        run: cargo build --release --target x86_64-unknown-linux-gnu -p ferrox-app

      - name: Create portable Linux archive
        run: |
          version="${FERROX_VERSION:-0.2.0-$(echo "${GITHUB_SHA:0:7}")}"
          tar_name="ferrox-linux-x86_64-${version}.tar.gz"
          tar -czf "$tar_name" -C target/x86_64-unknown-linux-gnu/release ferrox
          sha256sum "$tar_name" > "$tar_name.sha256"
          sha256sum target/x86_64-unknown-linux-gnu/release/ferrox > target/x86_64-unknown-linux-gnu/release/ferrox.sha256
          echo "Built $tar_name ($(du -h "$tar_name" | cut -f1))"

      - name: Verify Linux artifacts
        run: |
          version="${FERROX_VERSION:-0.2.0-$(echo "${GITHUB_SHA:0:7}")}"
          tar_name="ferrox-linux-x86_64-${version}.tar.gz"
          if [ ! -f "$tar_name" ]; then echo "Linux archive not found!"; exit 1; fi
          sha256sum -c "$tar_name.sha256" --status || { echo "Linux hash mismatch!"; exit 1; }
          echo "Linux artifacts verified OK"

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ferrox-linux-x86_64
          path: |
            ferrox-linux-x86_64*.tar.gz
            ferrox-linux-x86_64*.tar.gz.sha256
          retention-days: 30

  # =======================================================================
  # JOB 4: Publish Release (auto on every push + tags)
  # =======================================================================
  publish-release:
    name: Publish Release
    needs: [build-windows, build-linux]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: ferrox-windows-x86_64
          path: artifacts/windows

      - name: Download Linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: ferrox-linux-x86_64
          path: artifacts/linux

      - name: Prepare release metadata
        id: metadata
        shell: bash
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            VERSION="${{ github.ref_name }}"
            IS_TAG="true"
            CHANNEL="stable"
          else
            VERSION="nightly-${{ github.sha }}"
            IS_TAG="false"
            CHANNEL="nightly"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "is_tag=${IS_TAG}" >> "$GITHUB_OUTPUT"
          echo "channel=${CHANNEL}" >> "$GITHUB_OUTPUT"

      - name: Verify artifacts before publishing
        shell: bash
        run: |
          set -e
          echo "=== Windows ==="
          ls -lh artifacts/windows/ || echo "NO WINDOWS ARTIFACTS"
          echo "=== Linux ==="
          ls -lh artifacts/linux/ || echo "NO LINUX ARTIFACTS"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.metadata.outputs.version }}
          name: Ferrox Browser ${{ steps.metadata.outputs.version }} (${{ steps.metadata.outputs.channel }})
          body: |
            ## 🚀 Ferrox Browser ${{ steps.metadata.outputs.version }} (${{ steps.metadata.outputs.channel }})

            **متصفح ويب سريع مكتوب بـ Rust** - عالي السرعة، منخفض الذاكرة، يركز على الخصوصية

            ### التحميلات

            - **Windows (Installer):** `Ferrox-Setup-${{ steps.metadata.outputs.version }}-x86_64.exe` (تثبيت سريع ومباشر)
            - **Windows (Portable):** `ferrox-windows-x86_64-${{ steps.metadata.outputs.version }}.zip` (استخرج وشغّل)
            - **Linux (Portable):** `ferrox-linux-x86_64-${{ steps.metadata.outputs.version }}.tar.gz` (استخرج وشغّل)

            ### ملاحظات
            - تم البناء تلقائياً من GitHub Actions عند كل push.
            - تحقق من ملفات SHA256 قبل التثبيت.
            - القناة: ${{ steps.metadata.outputs.channel }}
          draft: false
          prerelease: ${{ steps.metadata.outputs.is_tag == 'false' }}
          files: |
            artifacts/windows/ferrox.exe
            artifacts/windows/ferrox.exe.sha256
            artifacts/windows/Ferrox-Setup-*.exe
            artifacts/windows/Ferrox-Setup-*.exe.sha256
            artifacts/windows/*.zip
            artifacts/windows/*.zip.sha256
            artifacts/linux/ferrox-linux-x86_64*.tar.gz
            artifacts/linux/ferrox-linux-x86_64*.tar.gz.sha256
